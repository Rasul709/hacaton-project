name: CI Quality & Cyber Defense Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Test, Security Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Run Automated Unit Tests (Vitest)
        run: npm run test

      - name: Security Dependency Audit
        run: npm audit --audit-level=critical || true

      - name: Build Production Assets
        run: npm run build

      - name: Run Full-Stack Cyber Defense E2E Suite
        run: |
          node server/src/index.js &
          sleep 2
          node scripts/e2e-check.js
        env:
          SKIP_FRONTEND: 'true'
          NODE_ENV: 'test'
